# fly.toml app configuration file generated for funicular on 2026-11-24T16:28:27Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'funicular'
primary_region = 'nrt'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
